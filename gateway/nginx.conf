# API GATEWAY (nginx). Es la única puerta para los clientes REST externos.
# Recibe  http://localhost:8000/api/...  y lo reenvía a  http://servicios:8080/servicios/api/...
# Los clientes no saben dónde vive Servicios; si mañana se mueve, solo se cambia este archivo.

events {}

http {
    upstream servicios {
        server servicios:8080;
    }

    # Algo típico de un gateway: limitar cuántas peticiones hace cada cliente (10 por segundo por IP)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://servicios/servicios/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Para ver en Postman que la respuesta pasó por el gateway
            add_header X-Gateway "taller4-nginx" always;
        }

        # Cualquier otra ruta no se expone hacia afuera
        location / {
            default_type application/json;
            return 404 '{"mensaje":"Ruta no expuesta por el API Gateway"}';
        }
    }
}
