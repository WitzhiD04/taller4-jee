<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Taller 4 - Login</title>
    <h:outputStylesheet name="estilos.css"/>
</h:head>
<h:body>
    <div class="tarjeta">
        <h1>Iniciar sesión</h1>
        <p class="nota">Escenarios 2 y 3 · JSF (Tomcat) → Servicios (REST) → Lógica → Datos → Postgres</p>

        <h:form id="formLogin">
            <h:messages styleClass="mensajes" infoClass="ok" errorClass="error" globalOnly="true"/>

            <label for="usuario">Usuario</label>
            <h:inputText id="usuario" value="#{login.usuario}"/>

            <label for="clave">Clave</label>
            <h:inputSecret id="clave" value="#{login.clave}"/>

            <h:commandButton id="ingresar" value="Ingresar" action="#{login.ingresar}"/>
        </h:form>

        <p class="nota">Prueba con <b>admin / admin123</b></p>
    </div>
</h:body>
</html>
