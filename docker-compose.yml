# Taller 4: arquitectura por capas en servidores separados.
#
#   Cliente REST (Postman) --> [nginx: API Gateway :8000] --\
#   Cliente SOAP (Postman/SoapUI) ---------------------------> [WildFly: Servicios REST+SOAP] -> [WildFly: Lógica] -> [WildFly: Datos] -> [Postgres]
#   Navegador --> [Tomcat: JSF] ---------------------------/
#
# Servicios -> Lógica -> Datos se llaman por EJB remoto (remote+http).
#
# Antes:  mvnw.cmd clean package     (genera los .war en */target)
# Subir:  docker compose up --build
# Bajar:  docker compose down -v     (-v borra también la BD)
#
# Web:    http://localhost:8080/presentacion                  (admin / admin123)
# REST:   http://localhost:8000/api/productos                 (por el API Gateway)
# SOAP:   http://localhost:8081/servicios/ProductosSoap?wsdl  (directo a Servicios)

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taller4
      POSTGRES_USER: taller4
      POSTGRES_PASSWORD: taller4
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller4 -d taller4"]
      interval: 5s
      retries: 10

  datos:
    build: ./datos
    environment:
      DB_HOST: postgres
      DB_NAME: taller4
      DB_USER: taller4
      DB_PASS: taller4
    depends_on:
      postgres:
        condition: service_healthy

  logica:
    build: ./logica
    environment:
      DATOS_URL: remote+http://datos:8080
      DATOS_USUARIO: ejbuser
      DATOS_CLAVE: ejbclave123
    depends_on:
      - datos

  servicios:
    build: ./servicios
    environment:
      LOGICA_URL: remote+http://logica:8080
      LOGICA_USUARIO: ejbuser
      LOGICA_CLAVE: ejbclave123
    ports:
      - "8081:8080"      # los clientes SOAP entran directo
    depends_on:
      - logica

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"        # los clientes REST entran por aquí
    depends_on:
      - servicios

  presentacion:
    build: ./presentacion
    environment:
      SERVICIOS_URL: http://servicios:8080/servicios/api
    ports:
      - "8080:8080"
    depends_on:
      - servicios
